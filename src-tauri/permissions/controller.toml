[[permission]]
identifier = "desktop-host"
description = "Native LAN host administration and coordinator authority."
commands.allow = [
  "control_host_enable",
  "control_host_invitation",
  "control_host_approve",
  "control_host_revoke",
  "control_host_register",
  "control_host_complete",
]

[[permission]]
identifier = "mobile-controller"
description = "Closed native controller operations only; no host or credentials."
commands.allow = [
  "get_application_mode",
  "controller_pair",
  "controller_scan_pair",
  "controller_request",
  "controller_connection",
  "controller_suspend",
  "controller_forget",
]
